name = "chittyscore-worker"
main = "src/index.ts"
compatibility_date = "2024-09-25"
account_id = "0bc21e3a5a9de1a4cc843be9c3e98121"

[vars]
ENVIRONMENT = "production"
SERVICE_NAME = "ChittyScore"
VERSION = "2.0.0"
LEDGER_URL = "https://ledger.chitty.cc"
CHAIN_URL = "https://chain.chitty.cc"

# KV for ephemeral reckoning cache (60s TTL)
[[kv_namespaces]]
binding = "SCORE_CACHE"
id = "placeholder-create-via-wrangler-kv-namespace-create"

# Production routes
[[routes]]
pattern = "score.chitty.cc/*"
zone_name = "chitty.cc"
